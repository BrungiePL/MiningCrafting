<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineCrafting</title>

    <style>
        /* Resetowanie marginesów i paddingu */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Styl całej strony */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        /* Nagłówek strony */
        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
        }

        /* Kontener z grą */
        .game-container {
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Styl iframe, by był dobrze widoczny */
        iframe {
            border: none;
            width: 640px;
            height: 480px;
        }

        /* Przycisk do interakcji */
        .start-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .start-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <h1>Zagraj w moją grę!</h1>

    <div class="game-container">
        <iframe src="https://scratch.mit.edu/projects/1169171962//embed" allowtransparency="true" width="640" height="480" frameborder="0" scrolling="no" allowfullscreen></iframe>
    </div>
